<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Bihar Student Talent Portal</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;min-height:100vh;display:grid;place-items:center}.box{background:#fff;width:min(430px,calc(100% - 40px));padding:32px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.1)}h1{color:#12457e;font-size:24px;margin:0 0 8px}.muted{color:#667085}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d5dbe5;border-radius:10px;font-size:16px}.btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#1264d6;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.err{margin-top:15px;background:#fff0f0;color:#a42222;padding:10px;border-radius:8px}</style></head><body><div class="box"><h1>Bihar Student Talent Portal</h1><div class="muted">Administrator Login</div><div id="err" class="err" style="display:none"></div><label>Admin Email</label><input id="email" type="email" autocomplete="username" placeholder="Enter admin email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password"><button class="btn" onclick="login()">Login to Admin Panel</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://mxrwqbygssjgzztlhmei.supabase.co','sb_publishable_3dRCLnMjk1tJGKLpDaq5Og_sPRb5QNU');async function login(){err.style.display='none';const{error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){err.textContent=error.message;err.style.display='block';return}location.href='admin.html'}(async()=>{const{data:{session}}=await sb.auth.getSession();if(session)location.href='admin.html'})();</script></body></html>

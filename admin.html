<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel | Bihar Student Talent Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#14233b;font-family:Inter,Arial,sans-serif}
.top{height:72px;background:#fff;border-bottom:1px solid #e3eaf2;display:flex;align-items:center;padding:0 5%;font-weight:800;color:#12457e}
.top .badge{margin-left:12px;background:#edf4fd;color:#1263c6;padding:6px 10px;border-radius:20px;font-size:12px}
.wrap{max-width:1250px;margin:30px auto;padding:0 20px}.hero{background:linear-gradient(120deg,#0d4e9e,#176fd0);color:#fff;border-radius:20px;padding:26px}
.hero h1{margin:5px 0}.hero p{margin:5px 0;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:18px 0}.card{background:#fff;border:1px solid #e1e8f1;border-radius:15px;padding:19px}.label{font-size:12px;text-transform:uppercase;color:#708097;font-weight:800}.num{font-size:28px;font-weight:800;margin-top:8px}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.filters label{font-size:12px;font-weight:800;color:#52627a}.filters select,.filters input{width:100%;margin-top:6px;padding:11px;border:1px solid #cbd7e5;border-radius:9px;background:#fff}
.actions{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#1263c6;color:#fff}.light{background:#edf4fd;color:#1263c6}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:12px;border-bottom:1px solid #e8edf3;text-align:left;font-size:13px}.table th{background:#f7f9fc;color:#53637a}.pill{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}.pending{background:#fff1d2;color:#805600}.approved{background:#e7f7ed;color:#18713b}.rejected{background:#ffe9e9;color:#a42222}
.modal{display:none;position:fixed;inset:0;background:#10233d66;align-items:center;justify-content:center;padding:20px}.modal .card{max-width:1000px;width:100%;max-height:92vh;overflow:auto}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.detail-field{border:1px solid #e2e8f0;border-radius:10px;padding:10px;background:#fafcff}.detail-field label{display:block;font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:5px}.detail-field input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px}.detail-field.wide{grid-column:1/-1}.admin-photo{width:130px;height:155px;object-fit:cover;border:1px solid #222}.admin-sign{width:220px;height:75px;object-fit:contain;border:1px solid #222}@media(max-width:700px){.detail-grid{grid-template-columns:1fr}}.close{float:right;border:0;background:#edf1f6;border-radius:8px;padding:7px 10px;cursor:pointer}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.stats,.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">Bihar Student Talent Portal <span class="badge">ADMIN PANEL</span></header>
<main class="wrap">
<section class="hero"><h1>Registration Management</h1><p>Review, filter and export student applications.</p></section>

<section class="stats">
<div class="card"><div class="label">Total Applications</div><div class="num" id="total">0</div></div>
<div class="card"><div class="label">Sports</div><div class="num" id="sports">0</div></div>
<div class="card"><div class="label">Cultural</div><div class="num" id="cultural">0</div></div>
<div class="card"><div class="label">Pending</div><div class="num" id="pending">0</div></div>
</section>

<section class="card">
<div class="filters">
<div><label>District</label><select id="district"><option value="">All Districts</option></select></div>
<div><label>Sport / Activity</label><select id="activity"><option value="">All Activities</option></select></div>
<div><label>Category</label><select id="category"><option value="">All</option><option>Sports</option><option>Cultural</option></select></div>
<div><label>Status</label><select id="status"><option value="">All Status</option><option>Submitted</option><option>Approved</option><option>Rejected</option><option>Correction Required</option></select></div>
<div><label>Search</label><input id="search" placeholder="Name / Mobile / ID"></div>
</div>
<div class="actions">
<button class="btn primary" onclick="render()">Apply Filters</button>
<button class="btn light" onclick="resetFilters()">Reset</button>
<button class="btn primary" onclick="downloadExcel()">Download Excel</button>
</div>
<div class="table-wrap"><table class="table"><thead><tr><th>Registration ID</th><th>Name</th><th>Mobile</th><th>District</th><th>Category</th><th>Activity</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</main>

<div class="modal" id="modal"><div class="card"><button class="close" onclick="closeModal()">Close</button><h2>Application Details</h2><div id="details"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://mxrwqbygssjgzztlhmei.supabase.co';
const SUPABASE_KEY='sb_publishable_3dRCLnMjk1tJGKLpDaq5Og_sPRb5QNU';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BIHAR_DISTRICTS=['Araria','Arwal','Aurangabad','Banka','Begusarai','Bhagalpur','Bhojpur','Buxar','Darbhanga','East Champaran (Motihari)','Gaya','Gopalganj','Jamui','Jehanabad','Kaimur (Bhabua)','Katihar','Khagaria','Kishanganj','Lakhisarai','Madhepura','Madhubani','Munger','Muzaffarpur','Nalanda','Nawada','Patna','Purnia','Rohtas','Saharsa','Samastipur','Saran','Sheikhpura','Sheohar','Sitamarhi','Siwan','Supaul','Vaishali','West Champaran (Bettiah)'];
let all=[],current=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function init(){district.innerHTML='<option value="">All Districts</option>'+BIHAR_DISTRICTS.map(x=>'<option>'+esc(x)+'</option>').join('');}
async function load(){
 const {data,error}=await sb.from('registrations').select('registration_id,programme_type,student_name,mobile,email,dob,gender,category,student_id,district,block,school_name,class_name,activity,activity_details,institution_type,participation_level,status,created_at,updated_at,father_name,mother_name,college_roll_no,address,category_name,locality,nationality,course_name,academic_year,university_registration_no,university_roll_no,photo_data,signature_data,aadhaar_last4').order('created_at',{ascending:false});
 if(error){alert('Unable to load registrations: '+error.message);return}
 all=(data||[]).map(x=>({...x,name:x.student_name,registrationId:x.registration_id,category:x.programme_type||x.category,status:x.status||'Pending',createdAt:x.created_at}));
 activity.innerHTML='<option value="">All Activities</option>'+[...new Set(all.map(x=>x.activity).filter(Boolean))].sort().map(x=>'<option>'+esc(x)+'</option>').join('');
 render();
}
function filtered(){const d=district.value,a=activity.value,c=category.value,s=status.value,q=search.value.toLowerCase().trim();return all.filter(x=>(!d||x.district===d)&&(!a||x.activity===a)&&(!c||x.category===c)&&(!s||x.status===s)&&(!q||[x.name,x.mobile,x.registrationId].some(v=>String(v||'').toLowerCase().includes(q))));}
function render(){const f=filtered();current=f;total.textContent=all.length;sports.textContent=all.filter(x=>x.category==='Sports').length;cultural.textContent=all.filter(x=>x.category==='Cultural').length;pending.textContent=all.filter(x=>x.status==='Pending').length;rows.innerHTML=f.length?f.map((x,i)=>'<tr><td>'+esc(x.registrationId)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.mobile)+'</td><td>'+esc(x.district||'—')+'</td><td>'+esc(x.category||'—')+'</td><td>'+esc(x.activity||'—')+'</td><td><span class="pill '+(x.status==='Approved'?'approved':x.status==='Rejected'?'rejected':'pending')+'">'+esc(x.status)+'</span></td><td><button class="btn light" onclick="view('+i+')">View</button></td></tr>').join(''):'<tr><td colspan="8">No applications found.</td></tr>';}
function view(i){const x=current[i];details.innerHTML='<p><b>Registration ID:</b> '+esc(x.registrationId)+'</p><p><b>Name:</b> '+esc(x.name)+'</p><p><b>Mobile:</b> '+esc(x.mobile)+'</p><p><b>DOB:</b> '+esc(x.dob)+'</p><p><b>Gender:</b> '+esc(x.gender)+'</p><p><b>District:</b> '+esc(x.district)+'</p><p><b>Block:</b> '+esc(x.block)+'</p><p><b>School:</b> '+esc(x.school_name)+'</p><p><b>Category:</b> '+esc(x.category)+'</p><p><b>Activity:</b> '+esc(x.activity)+'</p><p><b>Status:</b> '+esc(x.status)+'</p><hr><button class="btn primary" onclick="setStatus(\''+esc(x.registrationId)+'\',\'Approved\')">Approve</button> <button class="btn light" onclick="setStatus(\''+esc(x.registrationId)+'\',\'Correction Required\')">Correction Required</button> <button class="btn" style="background:#ffe9e9;color:#a42222" onclick="setStatus(\''+esc(x.registrationId)+'\',\'Rejected\')">Reject</button>';modal.style.display='flex';}
async function setStatus(id,st){const {error}=await sb.from('registrations').update({status:st,updated_at:new Date().toISOString()}).eq('registration_id',id);if(error){alert('Update failed: '+error.message);return}closeModal();await load();}
function closeModal(){modal.style.display='none'}
function resetFilters(){district.value='';activity.value='';category.value='';status.value='';search.value='';render()}
function downloadExcel(){const f=filtered();if(!f.length){alert('No filtered applications to export.');return}const h=['Registration ID','Name','Mobile','DOB','District','Block','School','Category','Activity','Status','Registration Date'];const lines=[h,...f.map(x=>[x.registrationId,x.name,x.mobile,x.dob,x.district,x.block,x.school_name,x.category,x.activity,x.status,x.createdAt])];const csv=lines.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bihar-student-registrations.csv';a.click();URL.revokeObjectURL(a.href);}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='admin-login.html';return}init();await load();}
boot();
</script>
</body></html>
